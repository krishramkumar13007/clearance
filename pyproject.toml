[project]
name = "clearance"
version = "0.1.0"
description = "Trajectory-aware execution gateway for coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "mcp>=1.2,<2"]

[project.scripts]
clearance = "clearance.__main__:main"
clearance-mcp = "clearance.mcp_server:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clearance"]
artifacts = ["src/clearance/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["docker: needs a running Docker daemon"]
